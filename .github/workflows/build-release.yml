name: Build and Release

run-name: 'Build and Release #${{ github.run_number }}'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows releases
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Build Release x64
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'build\Release\x64'
          $intermediate = Join-Path $env:RUNNER_TEMP 'AIQuotaChecker\x64'

          New-Item -ItemType Directory -Force -Path $output, $intermediate | Out-Null

          msbuild 'AIQuotaChecker.sln' `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:OutDir=$output" `
            "/p:IntDir=$intermediate"

          if ($LASTEXITCODE -ne 0) {
            throw "The x64 build failed with exit code $LASTEXITCODE."
          }

      - name: Build Release x86
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'build\Release\x86'
          $intermediate = Join-Path $env:RUNNER_TEMP 'AIQuotaChecker\x86'

          New-Item -ItemType Directory -Force -Path $output, $intermediate | Out-Null

          msbuild 'AIQuotaChecker.sln' `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x86 `
            "/p:OutDir=$output" `
            "/p:IntDir=$intermediate"

          if ($LASTEXITCODE -ne 0) {
            throw "The x86 build failed with exit code $LASTEXITCODE."
          }

      - name: Package release files
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy.MM.dd'
          $tag = "v1.0-build.$env:GITHUB_RUN_NUMBER"
          $title = "AIQuotaChecker $date - Build $env:GITHUB_RUN_NUMBER"
          $assets = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $x64Output = Join-Path $env:GITHUB_WORKSPACE 'build\Release\x64'
          $x86Output = Join-Path $env:GITHUB_WORKSPACE 'build\Release\x86'

          Remove-Item $assets -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          foreach ($output in @($x64Output, $x86Output)) {
            if (-not (Test-Path (Join-Path $output 'AIQuotaChecker.exe'))) {
              throw "Expected build output was not found: $output\AIQuotaChecker.exe"
            }

            Copy-Item 'README.md' (Join-Path $output 'README.md') -Force
          }

          $x64Archive = Join-Path $assets "AIQuotaChecker-Windows-x64-$tag.zip"
          $x86Archive = Join-Path $assets "AIQuotaChecker-Windows-x86-$tag.zip"

          Compress-Archive -Path (Join-Path $x64Output '*') -DestinationPath $x64Archive -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $x86Output '*') -DestinationPath $x86Archive -CompressionLevel Optimal

          $checksumFile = Join-Path $assets 'SHA256SUMS.txt'
          Get-ChildItem $assets -Filter '*.zip' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            } | Set-Content $checksumFile -Encoding utf8

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TITLE=$title" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Prepared release $tag"
          Get-ChildItem $assets | Format-Table Name, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AIQuotaChecker-Windows-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'release-assets') -File |
            Sort-Object Name |
            Select-Object -ExpandProperty FullName

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $assets `
              --repo $env:GITHUB_REPOSITORY `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Uploading assets to the existing release failed with exit code $LASTEXITCODE."
            }

            gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --title $env:RELEASE_TITLE `
              --latest
          }
          else {
            gh release create $env:RELEASE_TAG $assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --generate-notes `
              --latest
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Creating or updating the GitHub release failed with exit code $LASTEXITCODE."
          }
